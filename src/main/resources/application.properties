# Nome da aplicacao
spring.application.name=baozi-store-api

# Configuracao do banco H2 (fica na memoria, apaga quando desliga a aplicacao)
spring.datasource.url=jdbc:h2:mem:baozidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Deixa o Hibernate criar as tabelas sozinho a partir das entidades
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Mostra no terminal o SQL que esta sendo executado (ajuda a entender o que acontece)
spring.jpa.show-sql=true

# Habilita o console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Porta onde a API vai rodar
server.port=8080
